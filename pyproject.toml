[project]
name = "mnda"
version = "0.1.0"
description = "Downloads one file over Wi-Fi, Ethernet and mobile data at once via HTTP range requests. Benchmarks three schedulers and decomposes where the unused bandwidth goes."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psutil>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
analysis = ["numpy>=2.0", "pandas>=2.2", "matplotlib>=3.9"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-psutil"]

[project.scripts]
mnda = "mnda.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnda"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: touches a real interface or external host; deselected in CI with -m 'not network'",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.11"
# The target platform. Pinned so the Ubuntu lint job type-checks the Windows-only code paths
# (winreg, msvcrt, ctypes.windll, ProactorEventLoop) instead of treating them as unreachable.
platform = "win32"
mypy_path = "src"
files = ["src/mnda", "tests", "scripts"]
strict = true
